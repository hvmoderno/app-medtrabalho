<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Questões</title>
<link rel="stylesheet" href="../assets/app.css">
<style>
  .caixaDuvida { margin: 10px 0 0; }
  .caixaDuvida textarea { width: 100%; resize: vertical; margin-top: 4px;
    font: inherit; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--borda); background: var(--fundo); color: var(--texto); }
  .caixaDuvida textarea:focus { outline: 2px solid var(--acento); outline-offset: -2px; }

  body { padding-bottom: 40px; }

  .filtros { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-top: 4px; }
  .filtros .cartao { margin-bottom: 8px; }

  .placar { display: flex; gap: 6px; flex-wrap: wrap; font-size: .82rem; }
  .placar span { background: var(--superficie-2); padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .placar b { color: var(--texto); }

  .cabQ { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .enunciado { font-size: 1rem; line-height: 1.6; margin-bottom: 14px; }

  ul.alts { list-style: none; margin: 0; padding: 0; }
  ul.alts li { margin-bottom: 8px; }
  button.alt {
    display: flex; gap: 10px; width: 100%; text-align: left; align-items: flex-start;
    padding: 11px 12px; line-height: 1.5; font-size: .95rem;
  }
  button.alt .letra {
    flex: 0 0 26px; height: 26px; border-radius: 50%; background: var(--superficie-2);
    display: grid; place-items: center; font-weight: 700; font-size: .82rem; margin-top: 1px;
  }
  button.alt .txt { flex: 1; }
  button.alt.certa { border-color: var(--ok); background: var(--ok-suave); }
  button.alt.certa .letra { background: var(--ok); color: #fff; }
  button.alt.errada { border-color: var(--erro); background: var(--erro-suave); }
  button.alt.errada .letra { background: var(--erro); color: #fff; }
  button.alt .why {
    display: block; margin-top: 6px; font-size: .85rem; color: var(--texto-fraco);
    border-top: 1px dashed var(--borda); padding-top: 6px;
  }

  .explic { margin-top: 14px; border-top: 1px solid var(--borda); padding-top: 12px; }
  .explic h4 { margin: 0 0 4px; font-size: .78rem; text-transform: uppercase;
    letter-spacing: .04em; color: var(--texto-fraco); }
  .explic .bloco { margin-bottom: 10px; font-size: .92rem; }
  .refs { font-size: .8rem; color: var(--texto-fraco); }

  .navq { display: flex; gap: 8px; align-items: center; margin-top: 14px; }
  .navq .pos { font-size: .85rem; color: var(--texto-fraco); }


  /* Filtros recolhíveis: abertos ocupavam 273 px numa tela de 812 px. */
  .filtroCartao { padding: 0; }
  .resumoFiltro {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 13px; cursor: pointer; list-style: none;
    min-height: 44px;
  }
  .resumoFiltro::-webkit-details-marker { display: none; }
  .resumoTexto {
    flex: 1; font-weight: 600; font-size: .9rem;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .abrirFecha {
    font-size: .72rem; font-weight: 700; letter-spacing: .03em;
    text-transform: uppercase; color: var(--acento);
    background: var(--acento-suave); padding: 3px 9px; border-radius: 999px;
  }
  details[open] .abrirFecha::after { content: ' ▲'; }
  details:not([open]) .abrirFecha::after { content: ' ▼'; }
  .conteudoFiltro { padding: 0 13px 4px; }
  .placar { padding: 0 13px 11px; }

  .vazio { text-align: center; padding: 40px 16px; color: var(--texto-fraco); }
</style>
</head>
<body>
<div class="envolt">

  <!-- Os controles ficam recolhidos: no celular eles comiam 273 px e empurravam
       a questão para fora da tela. Aberto fica só o resumo do que está ativo. -->
  <div class="filtros">
    <details class="cartao filtroCartao" id="dlgFiltros">
      <summary class="resumoFiltro">
        <span class="resumoTexto" id="resumoFiltro">todos os temas</span>
        <span class="abrirFecha" aria-hidden="true">filtros</span>
      </summary>
      <div class="conteudoFiltro">
        <label for="fTema" class="pequeno fraco">Tema do edital</label>
        <select id="fTema" style="margin:4px 0 8px"></select>
        <div class="linha" style="margin-bottom:8px">
          <label for="fModo" class="pequeno fraco" style="flex:0 0 auto">Mostrar</label>
          <select id="fModo" style="flex:1;min-width:150px">
            <option value="todas">todas as questões</option>
            <option value="naoRespondidas">só as não respondidas</option>
            <option value="erradas">só as que eu errei</option>
          </select>
          <button id="btEmbaralhar" title="Embaralhar a ordem das questões">Embaralhar</button>
        </div>
        <div class="linha" id="linhaFracos" hidden>
          <span class="pequeno fraco" style="flex:0 0 100%">
            Onde você está mais frágil — toque para treinar só esse tema
          </span>
          <span class="linha" id="listaFracos"></span>
        </div>
      </div>
      <div class="linha" style="margin-top:6px">
        <label class="pequeno fraco" style="display:flex;align-items:center;gap:6px;cursor:pointer">
          <input type="checkbox" id="chkAutoLog" checked>
          Registrar no log de erros toda questão que eu errar
        </label>
        <button id="btDuvida" class="pequeno"
          title="Montar uma pergunta com o contexto desta questão">Tenho uma dúvida</button>
      </div>

      <!-- A dúvida sobre uma questão precisa de mais coisa que a dúvida sobre um
           guia: o enunciado, as alternativas, o que foi marcado e o comentário
           do app — porque muitas vezes a dúvida é justamente com o comentário. -->
      <div class="cartao caixaDuvida oculto" id="caixaDuvida">
        <label class="pequeno fraco" for="txtDuvida">Qual é a sua dúvida sobre esta questão?</label>
        <textarea id="txtDuvida" rows="3"
          placeholder="ex.: por que a letra que eu marquei está errada?"></textarea>
        <label class="pequeno fraco" style="display:flex;align-items:center;gap:6px;margin:8px 0 0;cursor:pointer">
          <input type="checkbox" id="chkAnexarQuestao" checked>
          Anexar a questão, o que eu marquei e o comentário
        </label>
        <div class="linha" style="margin-top:10px">
          <button class="primario" id="btCopiarDuvida">Copiar pergunta</button>
          <button id="btFecharDuvida">Cancelar</button>
          <span class="pequeno fraco" id="statusDuvida" style="flex:1"></span>
        </div>
        <p class="pequeno fraco" style="margin:8px 0 0">
          Cole no app do Claude. Nada sai daqui sozinho — o botão só põe o texto
          na área de transferência.
        </p>
      </div>
      <div class="placar" id="placar"></div>
    </details>
  </div>

  <!-- Confirmação do lançamento automático. Discreta de propósito: não pode
       cortar o ritmo de quem está numa sequência de questões. -->
  <div class="faixa info" id="avisoLog" hidden style="margin-bottom:10px"></div>

  <div id="area"></div>

</div>

<script src="../core/edital.js"></script>
<script src="../core/gabarito.js"></script>
<script src="../core/banco-loader.js"></script>
<script src="../core/storage.js"></script>
<script src="../core/desempenho.js"></script>
<script src="../core/log-erros.js"></script>
<script src="../core/duvida.js"></script>
<script src="questoes.js"></script>
</body>
</html>
