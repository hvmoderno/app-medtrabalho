<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Áudio</title>
<link rel="stylesheet" href="../assets/app.css">
<style>
  .faixa {
    display: flex; align-items: center; gap: 10px;
    width: 100%; text-align: left;
    background: var(--superficie); border: 1px solid var(--borda);
    border-left: 4px solid transparent;
    border-radius: var(--raio); padding: 11px 13px; margin: 0 0 8px;
    color: var(--texto); cursor: pointer; font: inherit;
  }
  .faixa:hover { border-color: var(--acento); }
  .faixa.tocando { border-left-color: var(--acento); background: var(--acento-suave); }
  .faixa .cod { font-weight: 700; color: var(--acento); flex: 0 0 3.2em; font-variant-numeric: tabular-nums; }
  .faixa .nome { flex: 1; }
  .faixa .dur { font-size: .8rem; color: var(--texto-fraco); font-variant-numeric: tabular-nums; }
  .faixa .ouvido { color: var(--ok); font-weight: 700; font-size: .78rem; }
  .faixa .baixada { color: var(--acento); font-size: .78rem; }

  .tocador {
    position: sticky; bottom: 0; z-index: 5;
    background: var(--superficie); border: 1px solid var(--borda);
    border-radius: var(--raio); box-shadow: var(--sombra);
    padding: 12px 14px; margin-top: 14px;
  }
  .tocador .titulo { font-weight: 650; margin-bottom: 6px; }
  .tocador .tempo { font-size: .82rem; color: var(--texto-fraco); font-variant-numeric: tabular-nums; }
  /* A barra é um controle, não enfeite: toca-se nela para pular no áudio.
     Altura generosa e área de toque folgada porque o uso é no carro. */
  .barra {
    position: relative;
    height: 10px; background: var(--superficie-2); border-radius: 999px;
    overflow: hidden; margin: 10px 0;
    cursor: pointer; touch-action: none;
  }
  .barra::before {
    /* Amplia a área de toque sem engordar o traço. */
    content: ''; position: absolute; inset: -12px 0; display: block;
  }
  .barra i {
    display: block; height: 100%; background: var(--acento); width: 0;
    pointer-events: none;
  }
  .barra:focus-visible { outline: 2px solid var(--acento); outline-offset: 3px; }
  .controles { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .controles select { min-width: 5.5em; }
  #btTocar { min-width: 6.5em; font-weight: 650; }
</style>
</head>
<body>
<div class="envolt">

  <div class="cartao">
    <h3 style="margin-top:0">Resumos em áudio</h3>
    <p class="pequeno fraco" style="margin:0 0 8px">
      Uma faixa por tema do edital, para ouvir no carro ou caminhando. Abre o
      tema, dá o essencial, numera as pegadinhas e repete as três principais no
      fim. Use como revisão do que já estudou: tabela e fluxograma não se
      escutam — para esses, os guias da aba Materiais.
    </p>
    <div class="placar" id="resumo"></div>
    <div class="linha" style="margin-top:10px">
      <button id="btBaixarTudo">Baixar todas para ouvir sem internet</button>
      <span class="pequeno fraco" id="estadoBaixar"></span>
    </div>
  </div>

  <div id="lista"></div>

  <div class="tocador" id="tocador" hidden>
    <div class="titulo" id="tocandoNome">—</div>
    <div class="tempo" id="tempo">0:00 / 0:00</div>
    <div class="barra" id="barra" role="slider" tabindex="0"
         aria-label="Posição no áudio" aria-valuemin="0" aria-valuemax="100"
         aria-valuenow="0"><i id="progresso"></i></div>
    <div class="controles">
      <button id="btVoltar15" title="Voltar 15 segundos">↺ 15s</button>
      <button id="btTocar">Pausar</button>
      <button id="btAvancar15" title="Avançar 15 segundos">15s ↻</button>
      <button id="btAnt">← Anterior</button>
      <button id="btProx">Próxima →</button>
      <label class="pequeno fraco" for="vel">Velocidade</label>
      <select id="vel">
        <option value="0.9">0,9×</option>
        <option value="1" selected>1×</option>
        <option value="1.25">1,25×</option>
        <option value="1.5">1,5×</option>
        <option value="1.75">1,75×</option>
        <option value="2">2×</option>
      </select>
      <span class="espaco"></span>
      <button id="btMarcar">Marcar como ouvida</button>
    </div>
  </div>

</div>

<script src="../core/edital.js"></script>
<script src="../core/storage.js"></script>
<script src="indice.js"></script>
<script>
(function () {
  'use strict';

  /* O player não vive aqui: vive no documento principal, porque o iOS
   * interrompe mídia de iframe ao bloquear a tela. Esta aba desenha a lista e
   * comanda o shell por window.parent.MTB_AUDIO. */
  var API = null;
  try { API = window.parent && window.parent.MTB_AUDIO; } catch (e) { API = null; }

  var elLista = document.getElementById('lista');
  var elResumo = document.getElementById('resumo');
  var elTocador = document.getElementById('tocador');
  var elNome = document.getElementById('tocandoNome');
  var elTempo = document.getElementById('tempo');
  var elProg = document.getElementById('progresso');
  var btTocar = document.getElementById('btTocar');
  var baixadas = {};
  var idxAtual = -1;

  function prog() {
    var a = Store.get('audio') || {};
    if (!a.ouvidas) a.ouvidas = {};
    if (!a.posicao) a.posicao = {};
    return a;
  }

  function mmss(seg) {
    if (!seg && seg !== 0) return '0:00';
    var m = Math.floor(seg / 60), s = Math.floor(seg % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function montar() {
    var a = prog();
    elLista.innerHTML = '';
    var ouvidas = 0, totalSeg = 0, nBaixadas = 0;

    AUDIO_FAIXAS.forEach(function (f, i) {
      totalSeg += f.seg || 0;
      if (a.ouvidas[f.tema]) ouvidas++;
      var temCopia = baixadas[f.arq.split('/').pop()];
      if (temCopia) nBaixadas++;

      var b = document.createElement('button');
      b.className = 'faixa' + (i === idxAtual ? ' tocando' : '');

      var cod = document.createElement('span');
      cod.className = 'cod'; cod.textContent = f.tema;
      var nome = document.createElement('span');
      nome.className = 'nome'; nome.textContent = f.nome;
      var dir = document.createElement('span');
      dir.className = 'linha';

      if (temCopia) {
        var bx = document.createElement('span');
        bx.className = 'baixada'; bx.textContent = 'offline';
        bx.title = 'Disponível sem internet';
        dir.appendChild(bx);
      }
      if (a.ouvidas[f.tema]) {
        var ok = document.createElement('span');
        ok.className = 'ouvido'; ok.textContent = 'ouvida';
        dir.appendChild(ok);
      } else if (a.posicao[f.tema] > 3) {
        var pc = document.createElement('span');
        pc.className = 'dur';
        pc.textContent = 'em ' + mmss(a.posicao[f.tema]);
        dir.appendChild(pc);
      }
      var d = document.createElement('span');
      d.className = 'dur'; d.textContent = mmss(f.seg);
      dir.appendChild(d);

      b.appendChild(cod); b.appendChild(nome); b.appendChild(dir);
      b.onclick = function () { if (API) API.tocar(i); };
      elLista.appendChild(b);
    });

    elResumo.innerHTML = '';
    [['faixas', AUDIO_FAIXAS.length],
     ['ouvidas', ouvidas + ' de ' + AUDIO_FAIXAS.length],
     ['offline', nBaixadas + ' de ' + AUDIO_FAIXAS.length],
     ['duração', Math.round(totalSeg / 60) + ' min']
    ].forEach(function (p) {
      var s = document.createElement('span');
      s.innerHTML = p[0] + ': <b>' + p[1] + '</b>';
      elResumo.appendChild(s);
    });
  }

  /* Estado que chega do shell a cada evento do player. */
  function aoMudarEstado(e) {
    idxAtual = e.idx;
    if (e.idx < 0) { elTocador.hidden = true; montar(); return; }
    var f = AUDIO_FAIXAS[e.idx];
    elTocador.hidden = false;
    elNome.textContent = f.tema + ' — ' + f.nome;
    btTocar.textContent = e.tocando ? 'Pausar' : 'Tocar';
    elTempo.textContent = mmss(e.posicao) + ' / ' + mmss(e.duracao || f.seg);
    elProg.style.width = (e.duracao ? (e.posicao / e.duracao * 100) : 0) + '%';
    montar();
  }

  // O shell só avisa em play/pause/fim; o relógio corrente é atualizado aqui.
  setInterval(function () {
    if (!API || idxAtual < 0) return;
    var e = API.estado();
    if (e.idx !== idxAtual) return;
    elTempo.textContent = mmss(e.posicao) + ' / ' + mmss(e.duracao);
    elProg.style.width = (e.duracao ? (e.posicao / e.duracao * 100) : 0) + '%';
    btTocar.textContent = e.tocando ? 'Pausar' : 'Tocar';
  }, 1000);

  btTocar.onclick = function () { if (API) API.alternar(); };
  document.getElementById('btAnt').onclick = function () { if (API) API.tocar(idxAtual - 1); };
  document.getElementById('btProx').onclick = function () { if (API) API.tocar(idxAtual + 1); };
  document.getElementById('btVoltar15').onclick = function () { if (API) API.pular(-15); };
  document.getElementById('btAvancar15').onclick = function () { if (API) API.pular(15); };

  /* ------------------------------------------------------- barra arrastável ---
   * Ela existia só como desenho: mostrava o progresso e não recebia toque, de
   * modo que dentro do app não havia como pular para o meio da faixa — só pela
   * tela bloqueada. Agora aceita toque, arrasto e teclado.
   */
  (function () {
    var barra = document.getElementById('barra');
    var arrastando = false;

    function fracaoDoEvento(ev) {
      var r = barra.getBoundingClientRect();
      var x = (ev.touches && ev.touches[0] ? ev.touches[0].clientX : ev.clientX);
      return Math.min(Math.max((x - r.left) / r.width, 0), 1);
    }

    function aplicar(ev) {
      if (!API || idxAtual < 0) return;
      var f = fracaoDoEvento(ev);
      elProg.style.width = (f * 100) + '%';       // resposta imediata ao dedo
      barra.setAttribute('aria-valuenow', Math.round(f * 100));
      API.irPara(f);
    }

    barra.addEventListener('pointerdown', function (ev) {
      arrastando = true;
      barra.setPointerCapture && barra.setPointerCapture(ev.pointerId);
      aplicar(ev);
      ev.preventDefault();
    });
    barra.addEventListener('pointermove', function (ev) {
      if (arrastando) aplicar(ev);
    });
    barra.addEventListener('pointerup', function () { arrastando = false; });
    barra.addEventListener('pointercancel', function () { arrastando = false; });

    // Teclado: setas movem 5 s, para quem usa no computador.
    barra.addEventListener('keydown', function (ev) {
      if (!API || idxAtual < 0) return;
      if (ev.key === 'ArrowRight') { API.pular(5); ev.preventDefault(); }
      else if (ev.key === 'ArrowLeft') { API.pular(-5); ev.preventDefault(); }
    });
  })();
  document.getElementById('vel').onchange = function () { if (API) API.velocidade(this.value); };
  document.getElementById('btMarcar').onclick = function () {
    if (idxAtual < 0) return;
    var a = prog();
    var t = AUDIO_FAIXAS[idxAtual].tema;
    if (a.ouvidas[t]) delete a.ouvidas[t]; else a.ouvidas[t] = Date.now();
    Store.set('audio', a); montar();
  };

  /* ---------------------------------------------------- baixar para offline ---
   * O player pede trechos (Range) e a resposta 206 não vira cópia utilizável.
   * Aqui o arquivo é buscado inteiro, para o service worker guardar. */
  var CACHE_AUDIO = 'mtb-audio-v1';
  var elEstado = document.getElementById('estadoBaixar');
  var btTudo = document.getElementById('btBaixarTudo');

  function lerBaixadas() {
    if (!('caches' in window)) return Promise.resolve({});
    return caches.open(CACHE_AUDIO).then(function (c) {
      return c.keys().then(function (ks) {
        var m = {};
        ks.forEach(function (r) { m[r.url.split('/').pop()] = true; });
        return m;
      });
    }).catch(function () { return {}; });
  }

  btTudo.onclick = function () {
    if (!('caches' in window)) {
      Store.avisar('aviso', 'Este navegador não permite guardar as faixas para ouvir sem internet.');
      return;
    }
    btTudo.disabled = true;
    var falhas = 0, feitas = 0;
    caches.open(CACHE_AUDIO).then(function (c) {
      var fila = AUDIO_FAIXAS.slice();
      function proxima() {
        if (!fila.length) {
          btTudo.disabled = false;
          elEstado.textContent = falhas
            ? feitas + ' baixadas, ' + falhas + ' falharam — tente de novo com melhor sinal.'
            : 'Todas as ' + feitas + ' faixas disponíveis sem internet.';
          if (falhas) Store.avisar('aviso', falhas + ' faixa(s) não baixaram. Repita com sinal melhor.');
          lerBaixadas().then(function (m) { baixadas = m; montar(); });
          return;
        }
        var f = fila.shift();
        elEstado.textContent = 'Baixando ' + (feitas + falhas + 1) + ' de ' + AUDIO_FAIXAS.length + '…';
        fetch(f.arq, { cache: 'reload' }).then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return c.put(f.arq, r);
        }).then(function () { feitas++; }).catch(function () { falhas++; })
          .then(proxima);
      }
      proxima();
    }).catch(function (e) {
      btTudo.disabled = false;
      Store.avisar('erro', 'Não consegui abrir o espaço de guarda das faixas.', e.message);
    });
  };

  Store.init().then(function () {
    var a = prog();
    if (a.velocidade) document.getElementById('vel').value = a.velocidade;

    if (!API) {
      Store.avisar('aviso',
        'A aba Áudio precisa ser aberta pelo aplicativo, não isolada, para o som ' +
        'continuar com a tela bloqueada.');
    } else {
      API.registrar(AUDIO_FAIXAS, aoMudarEstado);
    }

    return lerBaixadas();
  }).then(function (m) {
    baixadas = m || {};
    montar();
    var n = Object.keys(baixadas).length;
    if (n >= AUDIO_FAIXAS.length) {
      elEstado.textContent = 'Todas disponíveis sem internet.';
      btTudo.disabled = true;
    } else if (n > 0) {
      elEstado.textContent = n + ' de ' + AUDIO_FAIXAS.length + ' já baixadas.';
    }
  }).catch(function (e) {
    Store.avisar('erro', 'Não consegui carregar a aba de áudio.', e.message);
    montar();
  });
})();
</script>
</body>
</html>
