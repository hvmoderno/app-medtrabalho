<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Materiais</title>
<link rel="stylesheet" href="../assets/app.css">
<link rel="stylesheet" href="guia.css">
<style>
  .caixaDuvida { margin: 10px 0 0; }
  .caixaDuvida textarea { width: 100%; resize: vertical; margin-top: 4px;
    padding: 8px 10px; border: 1px solid var(--borda); border-radius: var(--raio);
    background: var(--superficie); color: var(--texto); font: inherit; font-size: .9rem; }
  .caixaDuvida textarea:focus { outline: 2px solid var(--acento); outline-offset: -2px; }
  body { padding-bottom: 40px; }
  .lista .sec { margin: 18px 0 6px; font-size: .78rem; text-transform: uppercase;
    letter-spacing: .04em; color: var(--texto-fraco); font-weight: 700; }
  .item { display: flex; gap: 10px; align-items: center; padding: 10px 12px;
    border: 1px solid var(--borda); border-radius: var(--raio); background: var(--superficie);
    margin-bottom: 6px; cursor: pointer; text-align: left; width: 100%; min-height: 0; }
  .item:disabled { cursor: default; opacity: .55; }
  .item .cod { flex: 0 0 34px; font-weight: 700; font-size: .82rem; color: var(--acento); }
  .item .nome { flex: 1; font-size: .92rem; line-height: 1.35; }
  .item .est { flex: 0 0 auto; }
  .voltar { margin-bottom: 12px; }
</style>
</head>
<body>
<div class="envolt">

  <div id="telaLista">
    <div class="cartao">
      <h1 style="margin:0 0 4px">Guias de revisão por tema</h1>
      <p class="pequeno fraco" style="margin:0">Um guia por tema do edital: tabelas,
        fluxogramas, pegadinhas de prova e mnemônicos. Objetivo e denso — feito para
        caber num bloco de 30 minutos.</p>
      <div class="barra" style="margin:12px 0 6px"><i id="barraLidos" style="width:0"></i></div>
      <div class="pequeno fraco" id="resumoLidos"></div>
    </div>
    <div class="lista" id="lista"></div>
  </div>

  <div id="telaGuia" class="oculto">
    <div class="linha voltar">
      <button id="btVoltar">← Todos os temas</button>
      <span style="flex:1"></span>
      <button id="btDuvida" title="Montar uma pergunta com o contexto deste guia">Tenho uma dúvida</button>
      <button id="btLido" class="primario">Marcar como revisado</button>
    </div>

    <!-- Monta a pergunta já com o contexto que costuma faltar quando a gente
         digita a dúvida do zero: tema do edital, guia aberto e o trecho que
         estava sendo lido. Copiar e colar no Claude leva tudo junto. -->
    <div class="cartao caixaDuvida oculto" id="caixaDuvida">
      <label class="pequeno fraco" for="txtDuvida">Qual é a sua dúvida sobre este tema?</label>
      <textarea id="txtDuvida" rows="3"
        placeholder="ex.: não entendi por que a concausa preexistente não afasta o nexo"></textarea>
      <label class="pequeno fraco" style="display:flex;align-items:center;gap:6px;margin:8px 0 0;cursor:pointer">
        <input type="checkbox" id="chkTrechoGuia" checked>
        Anexar o trecho do guia que está na tela
      </label>
      <div class="linha" style="margin-top:10px">
        <button class="primario" id="btCopiarDuvida">Copiar pergunta</button>
        <button id="btFecharDuvida">Cancelar</button>
        <span class="pequeno fraco" id="statusDuvida" style="flex:1"></span>
      </div>
      <p class="pequeno fraco" style="margin:8px 0 0">
        Cole no app do Claude. Nada sai daqui sozinho — o botão só põe o texto
        na área de transferência.
      </p>
    </div>

    <div class="cartao guia" id="conteudoGuia"></div>
    <div class="linha voltar" style="margin-top:12px">
      <button id="btVoltar2">← Todos os temas</button>
      <span style="flex:1"></span>
      <button id="btQuestoes">Ir para as questões deste tema →</button>
    </div>
  </div>

</div>

<script src="../core/edital.js"></script>
<script src="../core/storage.js"></script>
<script src="../core/desempenho.js"></script>
<script src="guias/indice.js"></script>
<script>
(function () {
  'use strict';

  var elLista = document.getElementById('lista');
  var telaLista = document.getElementById('telaLista');
  var telaGuia = document.getElementById('telaGuia');
  var elGuia = document.getElementById('conteudoGuia');
  var atual = null;

  function dados() {
    var m = Store.get('materiais') || {};
    if (!m.lidos) m.lidos = {};
    return m;
  }

  function temGuia(id) { return GUIAS.indexOf(id) !== -1; }

  function renderLista() {
    var m = dados();
    var comGuia = EDITAL.temas.filter(function (t) { return temGuia(t.id); });
    var lidos = comGuia.filter(function (t) { return m.lidos[t.id] > 0; }).length;

    document.getElementById('barraLidos').style.width =
      (comGuia.length ? lidos / comGuia.length * 100 : 0) + '%';
    document.getElementById('resumoLidos').innerHTML =
      '<b>' + lidos + '</b> de <b>' + comGuia.length + '</b> guias revisados · ' +
      GUIAS.length + ' de ' + EDITAL.temas.length + ' temas já têm guia escrito';

    elLista.innerHTML = '';

    // Desempenho por tema: a lista vira mapa de calor em vez de 49 linhas iguais.
    var desemp = DESEMPENHO.porTema();
    var leg = document.createElement('div');
    leg.className = 'legenda';
    leg.innerHTML =
      '<span><i class="fragil"></i>frágil (abaixo de 60%)</span>' +
      '<span><i class="construcao"></i>em construção (60–79%)</span>' +
      '<span><i class="firme"></i>firme (80% ou mais)</span>' +
      '<span><i class="neutro"></i>ainda sem questões respondidas</span>';
    elLista.appendChild(leg);

    EDITAL.secoes.forEach(function (sec) {
      var h = document.createElement('div');
      h.className = 'sec';
      h.setAttribute('data-sec', sec.id);
      h.textContent = 'Seção ' + sec.id + ' — ' + sec.nome;
      elLista.appendChild(h);

      EDITAL.daSecao(sec.id).forEach(function (t) {
        var b = document.createElement('button');
        b.className = 'item';
        b.disabled = !temGuia(t.id);

        var d = DESEMPENHO.aplicar(b, t.id, desemp);

        var cod = document.createElement('span');
        cod.className = 'cod'; cod.textContent = t.id;
        var nome = document.createElement('span');
        nome.className = 'nome'; nome.textContent = t.nome;

        var est = document.createElement('span');
        est.className = 'est linha';

        // Peso na prova, para orientar onde gastar o tempo que resta.
        if (t.peso === 'alto') {
          var pe = document.createElement('span');
          pe.className = 'selo-peso alto';
          pe.textContent = 'peso alto';
          pe.title = 'Tema de peso alto no edital';
          est.appendChild(pe);
        }

        // Taxa de acerto do tema.
        var sd = document.createElement('span');
        sd.className = 'selo-desemp ' + d.faixa;
        sd.textContent = d.curto;
        sd.title = d.titulo;
        est.appendChild(sd);

        var r = document.createElement('span');
        if (!temGuia(t.id)) {
          r.className = 'rotulo cinza'; r.textContent = 'em produção';
        } else if (m.lidos[t.id] > 0) {
          r.className = 'rotulo ok'; r.textContent = 'revisado';
        } else {
          r.className = 'rotulo'; r.textContent = 'abrir';
        }
        est.appendChild(r);

        b.appendChild(cod); b.appendChild(nome); b.appendChild(est);
        b.onclick = function () { abrir(t.id); };
        elLista.appendChild(b);
      });
    });
  }

  function abrir(id) {
    atual = id;
    elGuia.innerHTML = '<p class="fraco">carregando…</p>';
    telaLista.classList.add('oculto');
    telaGuia.classList.remove('oculto');
    window.scrollTo(0, 0);

    fetch('guias/' + id + '.html').then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(function (html) {
      elGuia.innerHTML = html;
      atualizarBotaoLido();
    }).catch(function (e) {
      elGuia.innerHTML = '<div class="faixa erro">Não consegui carregar o guia do tema ' +
        id + '. ' + e.message + '</div>';
      Store.avisar('erro', 'Falha ao carregar o guia do tema ' + id + '.', e.message);
    });

    Store.patch('materiais', function (m) { m = m || {}; m.ultimo = id; return m; });
  }

  function atualizarBotaoLido() {
    var m = dados();
    var b = document.getElementById('btLido');
    if (m.lidos[atual] > 0) {
      b.textContent = 'Revisado ✓ (desmarcar)';
      b.className = '';
    } else {
      b.textContent = 'Marcar como revisado';
      b.className = 'primario';
    }
  }

  document.getElementById('btLido').onclick = function () {
    Store.patch('materiais', function (m) {
      m = m || {}; if (!m.lidos) m.lidos = {};
      // Negativo = desmarcado nesta hora. Antes a chave era apagada, e o
      // aparelho vizinho — que ainda a tinha — devolvia o "revisado" na
      // sincronização seguinte.
      m.lidos[atual] = (m.lidos[atual] > 0) ? -Date.now() : Date.now();
      return m;
    });
    atualizarBotaoLido();
  };

  /* --------------------------------------------------------------- dúvida --
   * O que faz a pergunta render é o contexto: sem ele, "não entendi a
   * concausa" vira uma aula genérica. Com tema do edital, guia e trecho na
   * tela, a resposta já vem no recorte da prova.
   */
  var caixa = document.getElementById('caixaDuvida');
  var txtDuvida = document.getElementById('txtDuvida');
  var statusDuvida = document.getElementById('statusDuvida');

  /* Trecho visível: o parágrafo mais próximo do topo da janela. É onde o olho
   * está quando a dúvida aparece. */
  function trechoNaTela() {
    var blocos = elGuia.querySelectorAll('p, li, td, h2, h3');
    var melhor = null, menor = Infinity;
    for (var i = 0; i < blocos.length; i++) {
      var r = blocos[i].getBoundingClientRect();
      if (r.bottom < 60) continue;                 // já passou
      var d = Math.abs(r.top - 90);
      if (d < menor) { menor = d; melhor = blocos[i]; }
    }
    if (!melhor) return '';
    var textos = [], el = melhor;
    for (var k = 0; k < 3 && el; k++) {
      var s = (el.textContent || '').replace(/\s+/g, ' ').trim();
      if (s) textos.push(s);
      el = el.nextElementSibling;
    }
    return textos.join('\n\n').slice(0, 1200);
  }

  function montarPergunta() {
    var tema = EDITAL.tema(atual);
    var duvida = (txtDuvida.value || '').trim();
    var linhas = [
      'Estou estudando para a prova de título de Medicina do Trabalho (ANAMT/AMB, 01/11/2026).',
      '',
      'Tema do edital: ' + atual + ' — ' + (tema ? tema.nome : ''),
      'Estou lendo o guia de revisão deste tema no meu app de estudo.'
    ];
    if (document.getElementById('chkTrechoGuia').checked) {
      var trecho = trechoNaTela();
      if (trecho) {
        linhas.push('', 'Trecho do guia que eu estava lendo:', '---', trecho, '---');
      }
    }
    linhas.push('', 'Minha dúvida:', duvida, '',
      'Responda no nível da prova de título: direto, sem rodeio, e diga ' +
      'explicitamente se algum ponto é controverso ou se costuma cair como ' +
      'pegadinha. Se citar norma, prefira o conceito a número de artigo.');
    return linhas.join('\n');
  }

  function mostrarStatus(msg, erro) {
    statusDuvida.textContent = msg;
    statusDuvida.style.color = erro ? 'var(--erro)' : 'var(--ok)';
    clearTimeout(statusDuvida._t);
    statusDuvida._t = setTimeout(function () { statusDuvida.textContent = ''; }, 6000);
  }

  document.getElementById('btDuvida').onclick = function () {
    caixa.classList.toggle('oculto');
    if (!caixa.classList.contains('oculto')) { txtDuvida.focus(); }
  };
  document.getElementById('btFecharDuvida').onclick = function () {
    caixa.classList.add('oculto');
  };

  document.getElementById('btCopiarDuvida').onclick = function () {
    if (!(txtDuvida.value || '').trim()) {
      mostrarStatus('Escreva a dúvida primeiro.', true);
      txtDuvida.focus();
      return;
    }
    var texto = montarPergunta();
    function caiuNoManual(e) {
      // Safari em iPad recusa a área de transferência fora de alguns gestos.
      // Em vez de falhar calado, deixa o texto selecionado para copiar à mão.
      txtDuvida.value = texto;
      txtDuvida.select();
      mostrarStatus('Não consegui copiar sozinho — está selecionado, use Copiar.' +
        (e ? '' : ''), true);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(function () {
        mostrarStatus('Copiado. Cole no Claude.');
      }).catch(caiuNoManual);
    } else {
      caiuNoManual();
    }
  };

  function voltar() {
    caixa.classList.add('oculto');
    txtDuvida.value = '';
    statusDuvida.textContent = '';
    telaGuia.classList.add('oculto');
    telaLista.classList.remove('oculto');
    renderLista();
    window.scrollTo(0, 0);
  }
  document.getElementById('btVoltar').onclick = voltar;
  document.getElementById('btVoltar2').onclick = voltar;

  document.getElementById('btQuestoes').onclick = function () {
    // guarda o filtro e manda o shell trocar de aba
    Store.patch('questoes', function (q) {
      q = q || {}; if (!q.respostas) q.respostas = {};
      q.ultimo = { tema: atual, modo: 'todas', idx: 0 };
      return q;
    });
    try {
      if (window.parent && window.parent !== window) { window.parent.location.hash = 'questoes'; }
    } catch (e) { Store.avisar('aviso', 'Abra a aba Questões — o filtro já está no tema ' + atual + '.'); }
  };

  Store.init().then(function () {
    renderLista();
    var m = dados();
    if (m.ultimo && temGuia(m.ultimo)) { /* fica na lista; abrir é escolha do usuário */ }
  });
})();
</script>
</body>
</html>
